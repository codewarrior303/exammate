<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A1118" />
    <title>ExamMate</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background:#0a1118; color:#e2e8f0; }
      * { box-sizing:border-box; }
      body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 75% 5%,rgba(20,184,166,.1),transparent 38%),#0a1118; }
      [hidden] { display:none !important; }
      .loader { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#070d12; transition:opacity .2s ease; }
      .loader.done { opacity:0; pointer-events:none; }
      .loader-content { width:min(256px,calc(100vw - 48px)); text-align:center; }
      .loader img { display:block; width:64px; height:64px; object-fit:contain; margin:0 auto 20px; filter:drop-shadow(0 0 12px rgba(94,234,212,.35)); }
      .brand { margin:0; color:#fff; font-size:24px; font-weight:700; letter-spacing:-.04em; }
      .brand span { color:#5eead4; }
      .progress-track { height:4px; overflow:hidden; margin-top:28px; border-radius:99px; background:rgba(255,255,255,.08); }
      .progress-bar { width:100%; height:100%; transform:scaleX(0); transform-origin:left; border-radius:inherit; background:linear-gradient(90deg,#2dd4bf,#5eead4); box-shadow:0 0 10px rgba(94,234,212,.7); transition:transform .08s linear; }
      .loader-meta { display:flex; justify-content:space-between; margin-top:12px; color:#94a3b8; font-size:12px; }
      #progress-value { color:#5eead4; font:600 12px ui-monospace,monospace; }
      main { width:calc(100% - 32px); max-width:1480px; margin:0 auto; padding:28px 0 40px; }
      .heading { display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding-bottom:14px; border-bottom:1px solid rgba(45,212,191,.2); }
      h1 { margin:0; color:#fff; font-size:clamp(22px,4vw,30px); letter-spacing:-.035em; }
      .generated { margin:5px 0 0; color:#94a3b8; font-size:14px; }
      .actions { display:flex; flex-wrap:wrap; gap:10px; }
      button { min-height:38px; padding:8px 14px; border:1px solid rgba(45,212,191,.3); border-radius:10px; color:#e2e8f0; background:rgba(15,30,38,.7); font:inherit; font-size:14px; font-weight:500; cursor:pointer; }
      button:hover { border-color:rgba(94,234,212,.65); background:rgba(20,184,166,.12); }
      button:disabled { opacity:.5; cursor:wait; }
      .download-icon { margin-right:7px; color:#5eead4; }
      .table-wrap { margin-top:20px; overflow:auto; border:1px solid rgba(45,212,191,.3); border-radius:18px; background:rgba(17,32,40,.88); }
      table { width:100%; min-width:780px; border-collapse:collapse; text-align:left; }
      th,td { padding:15px 18px; border-bottom:1px solid rgba(45,212,191,.14); }
      th { color:#5eead4; font-size:12px; letter-spacing:.06em; }
      td { color:#d6e0e9; font-size:14px; }
      tbody tr:last-child td { border-bottom:0; }
      td.time { color:#5eead4; white-space:nowrap; }
      td.code { color:#99f6e4; font-weight:600; white-space:nowrap; }
      .empty-state { display:grid; min-height:100vh; place-content:center; padding:24px; text-align:center; }
      .empty-state h1 { font-size:24px; }
      .empty-state p { max-width:420px; margin:10px auto 0; color:#94a3b8; line-height:1.6; }
      #status { min-height:20px; margin:12px 0 0; color:#94a3b8; font-size:12px; }
      @media (max-width:700px) { main { width:calc(100% - 28px); padding-top:22px; } .heading { align-items:flex-start; flex-direction:column; } .actions { width:100%; } .actions button { flex:1; } th,td { padding:12px 10px; } }
      @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition-duration:.01ms !important; } }
    </style>
  </head>
  <body>
    <div id="offline-loader" class="loader" role="status" aria-live="polite">
      <div class="loader-content">
        <img src="/icons/exammate-192.png" alt="" width="64" height="64" />
        <p class="brand">Exam<span>Mate</span></p>
        <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
        <div class="loader-meta"><span>Loading your workspace...</span><span id="progress-value">0%</span></div>
      </div>
    </div>
    <main id="offline-workspace" hidden>
      <header class="heading">
        <div>
          <h1>Your generated exam table</h1>
          <p class="generated">Generated: <time id="generated-date"></time></p>
        </div>
        <div id="export-actions" class="actions" aria-label="Routine downloads" hidden>
          <button id="download-pdf" type="button"><span class="download-icon" aria-hidden="true">↓</span>Download PDF</button>
          <button id="download-png" type="button"><span class="download-icon" aria-hidden="true">↓</span>Download PNG</button>
        </div>
      </header>
      <div id="table-container" class="table-wrap"></div>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <section id="empty-state" class="empty-state" hidden>
      <div>
        <h1>No saved exam table is available offline</h1>
        <p>Connect to the internet and generate a routine first. ExamMate keeps your saved table on this device for up to 15 days.</p>
      </div>
    </section>
    <script type="module" src="/offline/offline-app.js"></script>
  </body>
</html>
